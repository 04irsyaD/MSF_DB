# ==============================================================
# MSF-DB v2 — Docker Compose
# Seluruh nama container dan volume diberi awalan msf2 agar v2 dapat
# berjalan bersamaan dengan msf-app tanpa saling menimpa.
# Jalankan semua service dengan: docker-compose up -d
# Stop semua: docker-compose down
# Reset total: docker-compose down -v
# ==============================================================

services:

  # ------------------------------------------------------------
  # OLLAMA — AI Service (Lokal LLM) - NONAKTIF KARENA PORT BENTROK DENGAN HOST OLLAMA NATIVE
  # ------------------------------------------------------------
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: msf2-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s

  # ------------------------------------------------------------
  # BACKEND — FastAPI
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msf2-backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11435}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-llama3.2}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-Indonesian}
      - DEFAULT_DETAIL_LEVEL=${DEFAULT_DETAIL_LEVEL:-detailed}
      - MAX_TABLES_PER_REQUEST=${MAX_TABLES_PER_REQUEST:-50}
      # Kosong secara sengaja: Admin Portal nonaktif total selama belum diisi.
      - ADMIN_PASSCODE=${ADMIN_PASSCODE:-}
      - MAX_JOB_RETENTION_MINUTES=${MAX_JOB_RETENTION_MINUTES:-60}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      - OUTPUT_DIR=/app/outputs
      - JOB_TIMEOUT_SECONDS=${JOB_TIMEOUT_SECONDS:-1800}
      - TZ=Asia/Jakarta
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      # Persistensi job (v2.2.0)
      - JOBS_DB_PATH=${JOBS_DB_PATH:-/app/outputs/jobs.db}
      - JOB_RECORD_RETENTION_DAYS=${JOB_RECORD_RETENTION_DAYS:-30}
      # Rate limiting per IP (v2.2.0)
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_GENERATE=${RATE_LIMIT_GENERATE:-10/minute}
      - RATE_LIMIT_ADMIN_VERIFY=${RATE_LIMIT_ADMIN_VERIFY:-5/minute}
      - RATE_LIMIT_TRUST_FORWARDED_FOR=${RATE_LIMIT_TRUST_FORWARDED_FOR:-false}
      # SQL Server (v2.2.0)
      - MSSQL_ODBC_DRIVER=${MSSQL_ODBC_DRIVER:-ODBC Driver 18 for SQL Server}
      - MSSQL_TRUST_SERVER_CERTIFICATE=${MSSQL_TRUST_SERVER_CERTIFICATE:-yes}
    volumes:
      - backend_outputs:/app/outputs    # Hasil file DOCX/PDF
      - ./backend/templates:/app/templates  # Template Word
      - ./backend/shortcuts_data:/app/shortcuts_data  # Data shortcut SQL
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------
  # FRONTEND — Next.js
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: msf2-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------
  # POSTGRESQL — Database untuk testing live DB connection
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: msf2-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-msf_test}
      - POSTGRES_USER=${POSTGRES_USER:-msf_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-msf_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d  # SQL init scripts (opsional)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-msf_user} -d ${POSTGRES_DB:-msf_test}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # CLOUDFLARE TUNNEL
  # ------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: msf2-cloudflared
    command: tunnel --no-autoupdate run --token $CLOUDFLARE_TUNNEL_TOKEN
    restart: unless-stopped
    depends_on:
      - frontend

# ==============================================================

# VOLUMES
# ==============================================================
volumes:
  # Dideklarasikan untuk kelengkapan, TIDAK terpakai: layanan ollama dinonaktifkan
  # dan dijalankan langsung di host karena bentrok port.
  ollama_data:
    name: msf2_ollama_data
  postgres_data:
    name: msf2_postgres_data
  # Memuat berkas DOCX/PDF, app.log, dan jobs.db (baru di v2.2.0).
  backend_outputs:
    name: msf2_backend_outputs
