name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan tracked files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked forbidden files
        shell: bash
        run: |
          set -euo pipefail

          tracked_forbidden=$(
            git ls-files |
              grep -E '(^|/)(\.venv|venv|node_modules|__pycache__|dist|build)(/|$)|(^|/)\.env(\..*)?$' |
              grep -Ev '(^|/)\.env\.example$' || true
          )

          if [ -n "$tracked_forbidden" ]; then
            echo "Forbidden tracked files found:"
            echo "$tracked_forbidden"
            exit 1
          fi

      - name: Check unsafe documentation placeholders
        shell: bash
        run: |
          set -euo pipefail

          targets_file="$(mktemp)"
          git ls-files -z |
            grep -zv '^\.github/workflows/secret-scan\.yml$' > "$targets_file"

          found=0
          regex_patterns=(
            'c:[\\]Users[\\]ROG'
            'ORACLE_PWD=[m]ypassword'
            'sqlplus[[:space:]]+sys/[m]ypassword'
            'CREATE USER[[:space:]]+myuser[[:space:]]+IDENTIFIED BY[[:space:]]+[m]ypassword'
            'MONGO_INITDB_ROOT_PASSWORD=[p]assword'
            'mongodb://admin:[p]assword@localhost:27017'
          )

          for pattern in "${regex_patterns[@]}"; do
            if xargs -0 -r grep -n -I -E -- "$pattern" < "$targets_file"; then
              found=1
            fi
          done

          if [ "$found" -ne 0 ]; then
            echo "Unsafe local paths or hardcoded credential placeholders found."
            exit 1
          fi
