name: Backend Security & Tests

on:
  pull_request:
    paths:
      - "msf-app/backend/**"
      - ".github/workflows/backend-security.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "msf-app/backend/**"
      - ".github/workflows/backend-security.yml"

defaults:
  run:
    working-directory: msf-app/backend

jobs:
  dependency-audit:
    name: pip-audit (CVE dependency)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --progress-spinner off

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            msf-app/backend/requirements.txt
            msf-app/backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          LOG_FILE_PATH: ""
        run: python -m pytest -q
