version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb
    ports:
      - "1532:5432"   # Host port : Container port
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
